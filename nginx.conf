server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源长缓存
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico|pdf|html)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # trailingSlash 静态导出：/projects/xxx -> /projects/xxx/index.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
